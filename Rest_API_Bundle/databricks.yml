# This is a Databricks asset bundle definition for Rest_API_Bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Rest_API_Bundle
  uuid: ee1d678b-f2ec-4e41-9f3d-310ceca8c91e

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id: 
    description: WarehouseId


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-bc666962-a1a7.cloud.databricks.com
    variables:
      catalog: project_dev
      schema: dev
      warehouse_id: 8db9114edf752cdf
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-bc666962-a1a7.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/barotparth512@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Rest_API_Data_Pipeline
    variables:
      catalog: project_pro
      schema: prod
      warehouse_id: 8db9114edf752cdf
    permissions:
      - user_name: barotparth512@gmail.com
        level: CAN_MANAGE
